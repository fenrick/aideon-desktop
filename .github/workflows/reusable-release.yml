name: Reusable Release

on:
  workflow_call:
    inputs:
      publish:
        description: 'Publish generated bundles to GitHub Releases'
        required: false
        type: boolean
        default: false
      os-matrix:
        description: 'JSON array of OS runners'
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'

env:
  NODE_VERSION: '24'

permissions:
  contents: write

jobs:
  package_app:
    name: Package App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # `secrets` cannot be referenced in an `if:` expression, so surface the
      # presence of the signing cert as a job env and gate the import step on it.
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs['os-matrix']) }}
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-suffix: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-suffix: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: JS checks
        run: pnpm run node:ci

      - name: Validate platform mapping
        shell: bash
        run: |
          if [[ -z "${{ matrix.target }}" ]]; then
            echo "::error::No target triple configured for ${{ matrix.os }}"
            exit 1
          fi

      # Cargo caching is handled by setup-rust-toolchain's built-in rust-cache
      # (keyed on Cargo.lock + rustc, per-target). The previous manual cache of
      # src-tauri/target cached the wrong dir (workspace builds go to /target).
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Import Apple codesign certificates
        if: matrix.os == 'macos-latest' && inputs.publish && env.APPLE_CERT_PRESENT == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri bundles
        run: pnpm tauri build --target ${{ matrix.target }} --ci
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect Tauri bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bundles
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [[ ! -d "$bundle_root" ]]; then
            echo "::error::Bundle directory $bundle_root not found"
            exit 1
          fi
          found=false
          while IFS= read -r -d '' file; do
            cp "$file" artifacts/bundles/
            found=true
          done < <(find "$bundle_root" -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.pkg' -o -name '*.app.tar.gz' \
            -o -name '*.zip' -o -name '*.tar.gz' \
            -o -name '*.msi' -o -name '*.exe' \
          \) -print0)
          if ! $found; then
            echo "::error::No bundle artifacts found under $bundle_root"
            find "$bundle_root" -maxdepth 2 -type f
            exit 1
          fi

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7
        with:
          name: aideon-desktop-${{ matrix.artifact-suffix }}-bundles
          path: artifacts/bundles/*
          if-no-files-found: error

      - name: Publish bundles to GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::Release tag is required to publish artifacts"
            exit 1
          fi
          bundle_files=(artifacts/bundles/*)
          if (( ${#bundle_files[@]} == 0 )); then
            echo "::error::No bundle artifacts found to publish"
            exit 1
          fi
          for file in "${bundle_files[@]}"; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done

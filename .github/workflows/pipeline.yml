name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    name: Node checks (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          # Keyed on lockfile + eslint config only (no commit SHA): a stable key
          # reused across runs, instead of a fresh 0-byte entry every commit.
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', '.eslintrc*', 'eslint.config*') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Keyed on the lockfile (not a per-edit source hash) so it isn't a new
          # entry on every source change; restore-keys still gives partial reuse.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - run: pnpm run node:format:check
      - run: pnpm run node:lint
      - run: pnpm run node:typecheck
      - run: pnpm run node:test

  rust-checks:
    name: Rust checks (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all --quiet
      - name: Architecture fitness — crate dependency direction (ADR-0011/D9)
        run: cargo run --locked -p aideon_xtask -- check-crate-boundaries

  build:
    name: Tauri Build (${{ matrix.os }})
    needs: [node-checks, rust-checks]
    # Full 3-OS bundle is the slowest gate. Run it on pushes to main (and the
    # release flow), not on every PR — PRs still compile Rust (rust-checks) and
    # build+run the app on Linux (e2e). Cross-platform breaks surface on merge.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Cargo caching is handled by setup-rust-toolchain's built-in rust-cache
      # (keyed on Cargo.lock + rustc, caches the workspace target at repo root).
      # The previous manual cache pointed at src-tauri/target — the wrong dir,
      # since src-tauri is a workspace member and builds go to the root /target.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build --ci

  e2e:
    name: WebDriver E2E
    needs: [node-checks, rust-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Linux GUI deps + WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            webkit2gtk-driver xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Cache tauri-driver install
        id: cache-tauri-driver-webdriver
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver-webdriver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: WebDriver tests
        run: pnpm run webdriver:test:headless

  # Tier-2 in-window UX validation gate (ADR-0040, M0-foundation.md §Tier-2, #317).
  #
  # Linux WebKitGTK (merge-blocking on every PR): launches the real app via
  # tauri-driver; asserts the shell composes both required regions; proves ≥1
  # interaction crossing the real adapter/host seam; proves per-window capability
  # denial through the real WebView ACL layer.
  #
  # macOS (push-to-main only): builds the debug binary; runs a launch-smoke
  # (static test-ID check + launch + screenshot artefact); emits an explicit log
  # that interactive WebDriver is unavailable (tauri-driver has no macOS support).
  # Never silently exits 0.
  tier2-ui-smoke:
    name: Tier-2 UI smoke (Linux WebKitGTK)
    needs: [node-checks, rust-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Linux GUI deps + WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            webkit2gtk-driver xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Cache tauri-driver install
        id: cache-tauri-driver-tier2
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver-tier2.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: Tier-2 in-window smoke (shell regions + capability denial + host seam)
        run: pnpm run tier2:test:headless

  tier2-macos-smoke:
    name: Tier-2 UI smoke (macOS launch-smoke)
    needs: [node-checks, rust-checks]
    # macOS interactive WebDriver is out of scope for M0 (tauri-driver has no
    # macOS support). We run the launch-smoke path (build → static test-ID check →
    # launch → screenshot artefact) on push only to avoid expensive macOS runner
    # costs on every PR. The hard merge gate is tier2-ui-smoke (Linux WebKitGTK).
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - run: pnpm install --frozen-lockfile

      - name: Tier-2 macOS launch-smoke (build + screenshot artefact + explicit WebDriver log)
        run: pnpm run tier2:test

      - name: Upload screenshot artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-screenshot
          path: test-artifacts/screenshots/macos-smoke.png
          if-no-files-found: warn
